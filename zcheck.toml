schema = 1
default = "check"

[execution]
jobs = 4
default_timeout = "20m"
repository_state = "preserve"

[tasks.structure]
description = "Enforce repository source shape and checked-in contract files."
run = ["scripts/structure-check"]
tools = ["python3"]
inputs = ["AGENTS.md", "Cargo.toml", "rust-toolchain.toml", "rustfmt.toml", "clippy.toml", ".github/workflows/ci.yml", "docs/schema-1.md", "crates/zcheck-core/contracts/schema-1/manifest.toml", "crates/zcheck-core/contracts/schema-1/plan-linux.json", "crates/zcheck-core/contracts/schema-1/receipt.json"]

[tasks.zrail]
description = "Enforce reviewed architecture policy without executing repository code."
run = ["zrail", "check"]
tools = ["zrail"]
inputs = ["zrail.toml", "zrail.lock"]

[tasks.git-diff]
description = "Reject whitespace errors in unstaged repository changes."
run = ["git", "diff", "--check"]
tools = ["git"]

[tasks.git-diff-cached]
description = "Reject whitespace errors in staged repository changes."
run = ["git", "diff", "--cached", "--check"]
tools = ["git"]

[tasks.setup-action-contracts-unix]
description = "Test the exact-release setup action with the Unix Python command."
platforms = ["linux", "macos"]
run = ["python3", "-m", "unittest", "discover", "-s", ".github/actions/setup-zcheck", "-p", "test_*.py"]
tools = ["python3"]
inputs = [".github/actions/setup-zcheck/action.yml", ".github/actions/setup-zcheck/install.py", ".github/actions/setup-zcheck/test_install.py"]

[tasks.setup-action-contracts-windows]
description = "Test the exact-release setup action with the Windows Python command."
platforms = ["windows"]
run = ["python", "-m", "unittest", "discover", "-s", ".github/actions/setup-zcheck", "-p", "test_*.py"]
tools = ["python"]
inputs = [".github/actions/setup-zcheck/action.yml", ".github/actions/setup-zcheck/install.py", ".github/actions/setup-zcheck/test_install.py"]

[tasks.setup-action-contracts]
description = "Test exact-release setup action selection, verification, and extraction."
needs = ["setup-action-contracts-unix", "setup-action-contracts-windows"]

[tasks.architecture]
description = "Validate source shape, architecture policy, and diff hygiene."
needs = ["structure", "zrail", "git-diff", "git-diff-cached", "setup-action-contracts"]

[tasks.format]
description = "Validate Rust formatting."
run = ["cargo", "fmt", "--all", "--", "--check"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.clippy]
description = "Run Clippy with warnings denied."
run = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--offline", "--", "-D", "warnings"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.docs]
description = "Build workspace documentation with warnings denied."
run = ["cargo", "doc", "--locked", "--workspace", "--all-features", "--no-deps", "--offline"]
env = { RUSTDOCFLAGS = "-D warnings" }
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.rust-lint]
description = "Validate formatting, lints, and documentation."
needs = ["format", "clippy", "docs"]

[tasks.test]
description = "Run the complete Rust workspace test suite."
run = ["cargo", "test", "--locked", "--workspace", "--all-features", "--offline"]
tools = ["cargo"]
resources = ["cargo-target"]
inputs = ["crates/zcheck-core/contracts/schema-1/manifest.toml", "crates/zcheck-core/contracts/schema-1/plan-linux.json", "crates/zcheck-core/contracts/schema-1/receipt.json"]

[tasks.rust-test]
description = "Validate model, CLI, and cross-repository fixture behavior."
needs = ["test"]

[tasks.package-contracts]
description = "Verify packaged core and CLI crates from extracted sources."
run = ["scripts/package-check"]
tools = ["cargo", "tar"]
resources = ["cargo-target"]
inputs = ["crates/zcheck-core/contracts/schema-1/manifest.toml", "crates/zcheck-core/contracts/schema-1/plan-linux.json", "crates/zcheck-core/contracts/schema-1/receipt.json"]

[tasks.package]
description = "Validate publishable crate archives."
needs = ["package-contracts"]

[tasks.check]
description = "Run complete local project qualification."
needs = ["architecture", "rust-lint", "rust-test", "package"]
