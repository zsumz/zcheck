[workspace]
members = [
    "crates/zcheck-core",
    "crates/zcheck-cli",
    "crates/zcheck-testkit",
]
default-members = ["crates/zcheck-cli"]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.96"
authors = ["zsumz <shawn@zsumz.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/zsumz/zcheck"
homepage = "https://github.com/zsumz/zcheck"

[workspace.dependencies]
command-group = "5.0.1"
nix = { version = "0.27.1", default-features = false, features = ["signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
signal-hook = { version = "0.4.4", default-features = false }
toml = "0.9.12"
win32job = "2.0.3"
zcheck-core = { path = "crates/zcheck-core", version = "=0.0.2" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
