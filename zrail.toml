schema = 1
adapters = ["rust"]

[repository]
roots = ["crates"]
exclude = []
workspace_members = "exact"
nested_git = "deny"
submodules = "deny"
symlinks = "inside"

[[gate]]
name = "check"
kind = "local"
path = "zcheck.toml"
inputs = ["scripts/structure-check", "scripts/package-check", ".github/actions/setup-zcheck/action.yml", ".github/actions/setup-zcheck/install.py", ".github/actions/setup-zcheck/test_install.py", "rust-toolchain.toml", "rustfmt.toml", "clippy.toml", ".gitignore", "Cargo.toml", "crates/zcheck-cli/Cargo.toml", "crates/zcheck-core/Cargo.toml", "crates/zcheck-testkit/Cargo.toml", "docs/schema-1.md", "crates/zcheck-core/contracts/schema-1/manifest.toml", "crates/zcheck-core/contracts/schema-1/plan-linux.json", "crates/zcheck-core/contracts/schema-1/receipt.json"]
reason = "The repository's canonical local qualification graph and substantive leaf programs."

[[gate]]
name = "ci"
kind = "ci"
path = ".github/workflows/ci.yml"
inputs = [".github/actions/setup-rust/action.yml", ".github/actions/setup-zrail/action.yml"]
requires = ["check"]
reason = "Hosted qualification bootstraps zcheck and executes the canonical local graph."

[[gate]]
name = "security"
kind = "ci"
path = ".github/workflows/security.yml"
inputs = [".github/actions/setup-rust/action.yml"]
requires = ["check"]
reason = "Online RustSec advisory checks complement the offline repository qualification graph."

[[gate]]
name = "architecture-review"
kind = "ci"
path = ".github/workflows/authority.yml"
inputs = [".github/actions/setup-rust/action.yml", ".github/actions/setup-zrail/action.yml"]
requires = ["check"]
reason = "Protected-base analysis reviews proposed source as data without executing it."

[[gate]]
name = "release"
kind = "release"
path = ".github/workflows/release.yml"
inputs = [".github/actions/setup-rust/action.yml", ".github/actions/setup-zrail/action.yml", "scripts/package-release.py", "scripts/release-notes.py", "CHANGELOG.md", "Cargo.toml", "LICENSE", "README.md"]
requires = ["ci", "security"]
reason = "Protected version tags qualify, package, runtime-test, attest, and atomically publish the complete native release set."

