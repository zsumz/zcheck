[dependencies]
mode = "locked"
unassigned_packages = "deny"
cycles = "deny"

[[dependencies.crate_root]]
package = "command-group"
root = "command_group"
reason = "The task executor uses reviewed cross-platform process-group and Job Object containment."
[dependencies.crate_root.source]
kind = "registry"
requirement = "5.0.1"

[[dependencies.crate_root]]
package = "nix"
root = "nix"
reason = "Unix task-tree liveness uses the reviewed safe process-group signal interface."
[dependencies.crate_root.source]
kind = "registry"
requirement = "0.27.1"

[[dependencies.crate_root]]
package = "serde"
root = "serde"
reason = "The published serde library exposes the serde crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "1.0.229"

[[dependencies.crate_root]]
package = "serde_json"
root = "serde_json"
reason = "The published serde_json library exposes the serde_json crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "1.0.151"

[[dependencies.crate_root]]
package = "sha2"
root = "sha2"
reason = "The published sha2 library exposes the SHA-256 implementation used for evidence digests."
[dependencies.crate_root.source]
kind = "registry"
requirement = "0.10.9"

[[dependencies.crate_root]]
package = "signal-hook"
root = "signal_hook"
reason = "The executor observes Ctrl-C and Unix task fixtures observe graceful termination without unsafe signal handlers."
[dependencies.crate_root.source]
kind = "registry"
requirement = "0.4.4"

[[dependencies.crate_root]]
package = "toml"
root = "toml"
reason = "The published toml library exposes the toml crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "0.9.12"

[[dependencies.crate_root]]
package = "win32job"
root = "win32job"
reason = "Windows task-tree liveness uses a reviewed safe Job Object observer."
[dependencies.crate_root.source]
kind = "registry"
requirement = "2.0.3"

[source.rust]
module_docs = "required"
facades = "declarative"
entrypoints = "declarative"
tests = "sibling"

[source.rust.macros]
mode = "deny-unreviewed"

[[source.rust.macros.allow]]
name = "Clone"
reason = "Data models and error values use Rust's built-in Clone derive."

[[source.rust.macros.allow]]
name = "Copy"
reason = "Small platform, status, and policy enums use Rust's built-in Copy derive."

[[source.rust.macros.allow]]
name = "Debug"
reason = "Models and internal state use Rust's built-in Debug derive for diagnostics."

[[source.rust.macros.allow]]
name = "Default"
reason = "Configuration values use Rust's built-in Default derive where schema defaults are explicit."

[[source.rust.macros.allow]]
name = "Eq"
reason = "Deterministic value models use Rust's built-in Eq derive."

[[source.rust.macros.allow]]
name = "Hash"
reason = "Validated task names use Rust's built-in Hash derive for identity collections."

[[source.rust.macros.allow]]
name = "Ord"
reason = "Task and platform values use Rust's built-in Ord derive for deterministic ordering."

[[source.rust.macros.allow]]
name = "PartialEq"
reason = "Models and tests use Rust's built-in PartialEq derive for exact comparisons."

[[source.rust.macros.allow]]
name = "PartialOrd"
reason = "Task and platform values use Rust's built-in PartialOrd derive for ordering."

[[source.rust.macros.allow]]
name = "assert"
reason = "Tests use Rust's standard assertion expansion."

[[source.rust.macros.allow]]
name = "assert_eq"
reason = "Tests use Rust's standard equality assertion expansion."

[[source.rust.macros.allow]]
name = "eprintln"
reason = "The CLI writes bounded user-facing failures to standard error."

[[source.rust.macros.allow]]
name = "format"
reason = "Diagnostics and deterministic rendering use Rust's standard formatting expansion."

[[source.rust.macros.allow]]
name = "matches"
reason = "The CLI grammar and validated bytes use Rust's standard pattern predicate."

[[source.rust.macros.allow]]
name = "println"
reason = "The CLI writes completed human and JSON reports to standard output."

[[source.rust.macros.allow]]
name = "serde"
reason = "Serde helper attributes configure reviewed serialization derives."
[source.rust.macros.allow.source]
kind = "registry"
requirement = "1.0.229"

[[source.rust.macros.allow]]
name = "serde::Deserialize"
reason = "Strict manifest wire types use the reviewed serde Deserialize derive."
[source.rust.macros.allow.source]
kind = "registry"
requirement = "1.0.229"

[[source.rust.macros.allow]]
name = "serde::Serialize"
reason = "Versioned plan and inspection contracts use the reviewed serde Serialize derive."
[source.rust.macros.allow.source]
kind = "registry"
requirement = "1.0.229"

[[source.rust.macros.allow]]
name = "vec"
reason = "Plans and tests use Rust's standard vector construction expansion."

[source.rust.hygiene]
unsafe = "deny"
lint_suppressions = "deny"
deny_methods = ["unwrap", "expect"]
deny_macros = ["panic", "todo", "unimplemented", "unreachable", "dbg"]

[source.rust.size.facade]
target = 80
hard = 120

[source.rust.size.implementation]
target = 240
hard = 300

[source.rust.size.test]
target = 300
hard = 300

[source.rust.size.auxiliary]
target = 300
hard = 300

[[layer]]
name = "model"
packages = ["zcheck-core"]
may_depend_on = []
reason = "Public manifest and plan contracts remain independent of execution and presentation."

[layer.dependencies]
external = "locked"

[[layer]]
name = "application"
packages = ["zcheck"]
may_depend_on = ["model", "verification"]
reason = "The CLI uses the public model at runtime and the unpublished testkit only in integration tests."

[layer.dependencies]
external = "locked"

[[layer]]
name = "verification"
packages = ["zcheck-testkit"]
may_depend_on = ["model"]
reason = "Cross-repository fixtures judge the model without entering the product graph."

[layer.dependencies]
external = "none"

[[dependency]]
name = "core-remains-execution-free"
from = "zcheck-core"
deny = ["zcheck", "zcheck-testkit"]
reason = "The public model must not depend on the CLI, scheduler, or adversarial fixture package."

[[scope]]
name = "core-execution-boundary"
include = ["crates/zcheck-core/src/**"]
exclude = ["crates/zcheck-core/src/**/*_test.rs"]
reason = "Manifest parsing and planning do not discover repositories, execute processes, or inspect hosts."

[scope.symbols]
deny = ["std::env", "std::fs", "std::net", "std::process"]

[[owner]]
name = "design-fixtures"
kind = "directory"
match = "**/fixtures"
allow = ["crates/zcheck-testkit/tests/fixtures"]
reason = "Cross-repository manifest fixtures have one visible unpublished owner."

[[owner]]
name = "filesystem-capability"
kind = "capability"
within = ["crates/**"]
match = "std::fs"
allow = [
  "crates/zcheck-cli/src/app/discovery.rs",
  "crates/zcheck-cli/src/app/execution/artifacts.rs",
  "crates/zcheck-cli/src/app/execution/evidence.rs",
  "crates/zcheck-cli/src/app/execution/github.rs",
  "crates/zcheck-cli/src/app/execution/github_test.rs",
  "crates/zcheck-cli/src/app/execution/logs.rs",
  "crates/zcheck-cli/src/app/execution/logs/location.rs",
  "crates/zcheck-cli/src/app/execution/preflight.rs",
  "crates/zcheck-cli/src/app/execution/process/child.rs",
  "crates/zcheck-cli/src/app/execution/receipt_io.rs",
  "crates/zcheck-cli/src/app/execution/repository.rs",
  "crates/zcheck-cli/src/app/execution/repository/support.rs",
  "crates/zcheck-cli/src/app/execution/repository_test.rs",
  "crates/zcheck-cli/tests/concurrency.rs",
  "crates/zcheck-cli/tests/concurrency/fixture.rs",
  "crates/zcheck-cli/tests/github_reporter.rs",
  "crates/zcheck-cli/tests/process_control.rs",
  "crates/zcheck-cli/tests/process_control/fixture.rs",
  "crates/zcheck-cli/tests/repository_evidence.rs",
  "crates/zcheck-testkit/src/repository.rs",
  "crates/zcheck-testkit/tests/fixtures.rs",
  "crates/zcheck-testkit/tests/release_packaging.rs",
  "crates/zcheck-testkit/tests/release_workflow.rs",
]
reason = "Repository discovery, evidence capture, artifact persistence, Linux process-tree liveness, and isolated or release-contract fixtures own filesystem access."

[[owner]]
name = "process-capability"
kind = "capability"
within = ["crates/**"]
match = "std::process::Command"
allow = [
  "crates/zcheck-cli/src/app/execution/process/child.rs",
  "crates/zcheck-cli/src/app/execution/repository/support.rs",
  "crates/zcheck-cli/src/app/execution/repository_test.rs",
  "crates/zcheck-cli/src/app/internal_host.rs",
  "crates/zcheck-cli/tests/cli.rs",
  "crates/zcheck-cli/tests/process_control/fixture.rs",
  "crates/zcheck-testkit/src/repository.rs",
  "crates/zcheck-testkit/tests/release_packaging.rs",
]
reason = "Task execution and Git evidence capture own child processes; tests own isolated proof and release-helper processes."

[[owner]]
name = "process-construction"
kind = "call"
within = ["crates/**"]
match = "std::process::Command::new"
allow = [
  "crates/zcheck-cli/src/app/execution/process/child.rs",
  "crates/zcheck-cli/src/app/execution/repository/support.rs",
  "crates/zcheck-cli/src/app/execution/repository_test.rs",
  "crates/zcheck-cli/src/app/internal_host.rs",
  "crates/zcheck-cli/tests/cli.rs",
  "crates/zcheck-cli/tests/process_control/fixture.rs",
  "crates/zcheck-testkit/src/repository.rs",
  "crates/zcheck-testkit/tests/release_packaging.rs",
]
reason = "Process construction is confined to task execution, Git evidence capture, and isolated or release-contract test boundaries."
