name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rustsec:
    name: rustsec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Reject repository-local Cargo configuration
        run: |
          for cargo_config in .cargo/config .cargo/config.toml .cargo/audit.toml; do
            if [[ -e "$cargo_config" || -L "$cargo_config" ]]; then
              echo "repository-local Cargo configuration is not permitted: $cargo_config" >&2
              exit 1
            fi
          done

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock
