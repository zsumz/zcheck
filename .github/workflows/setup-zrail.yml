name: setup-zrail integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  setup:
    name: install published zrail
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up zrail
        uses: zactionsz/setup-zrail@e6f8b7b742b94d4d42ed1133df500f75eb465aa2
        with:
          version: "0.0.2"
          sha256: fb535cf8a72cf15995f0c4d2ea640629624b300736c67c7961e058f4a12419d9

      - name: Verify installed zrail
        run: zrail --version
