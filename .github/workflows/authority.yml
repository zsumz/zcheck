name: Architecture preview

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: architecture-authority-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  review:
    name: protected-base source preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZRAIL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ZRAIL_PROPOSAL_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ZRAIL_BASE_SHA }}
          persist-credentials: false

      - name: Set up trusted Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Set up trusted reviewed zrail
        uses: ./.github/actions/setup-zrail

      - name: Check out proposal as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ env.ZRAIL_PROPOSAL_SHA }}
          path: proposal
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Independently review observed proposal state
        run: >-
          zrail review
          --authority-root "$GITHUB_WORKSPACE"
          --base "$ZRAIL_BASE_SHA"
          --root "$GITHUB_WORKSPACE/proposal"
